<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição</title>
    <link rel="stylesheet" href="inscricao.css">
</head>

<body>

    <section class="secao-inscricao">

        <h2>Inscreva-se na Plataforma</h2>

        <form id="formInscricao">

            <div>
                <label for="nomeInscricao">Nome completo:</label>
                <input type="text" id="nomeInscricao" placeholder="Seu nome" required>
            </div>

            <div>
                <label for="emailInscricao">E-mail:</label>
                <input type="email" id="emailInscricao" placeholder="Seu e-mail" required>
            </div>

            <div>
                <label for="cursoInscricao">Curso de interesse:</label>
                <input type="text" id="cursoInscricao" placeholder="Nome do curso" required>
            </div>

            <div class="botoes-form">
                <button type="submit">Inscrever-se</button>
                <button type="reset">Limpar</button>
            </div>

            <p id="msgInscricao" class="mensagem-form"></p>

        </form>

    </section>

    <script src="script.js"></script>
</body>

</html>
